# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      TEST_PROJECT_PATH: KGSoft.TinyHttpClient.Test/KGSoft.TinyHttpClient.Test.csproj

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore "$TEST_PROJECT_PATH"
    - name: Build
      run: dotnet build "$TEST_PROJECT_PATH" --no-restore
    - name: Test
      run: dotnet test "$TEST_PROJECT_PATH" --no-build --verbosity normal
